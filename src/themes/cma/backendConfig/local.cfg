# By default, browse hierarchical indexes are created based on the used controlled
# vocabularies in the submission forms. These could be disabled adding the name of
# the vocabularies to exclude in this comma-separated property.
# (Requires reboot of servlet container, e.g. Tomcat, to reload)
default.language = el
webui.browse.vocabularies.disabled = srsc
webui.supported.locales = el
webui.browse.index.1 = dateissued:item:dateissued
webui.browse.index.2 = author:metadata:dc.contributor.*\,dc.creator:text
webui.browse.index.3 = title:item:title
webui.browse.index.4 = subject:metadata:dc.subject:text
webui.browse.index.5 = location:metadata:dc.coverage.spatial:text
dspace.server.url = https://library.cyprusmusicarchive.org/server
dspace.ui.url = https://library.cyprusmusicarchive.org
#dspace.server.ssr.url = http://localhost:8080/server
# Name of the site
dspace.name = Cyprus Music Archive Library
dspace.shortname = CMA

#################################################
# SPRING BOOT SETTINGS (File Upload Limits)    #
#################################################
# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size = 5GB

# Maximum size of a multipart request (i.e. max total size of all files in one request)
spring.servlet.multipart.max-request-size = 5GB
#################################################
# USAGE STATISTICS (CMA, 2026-11-22)            #
#################################################
# Free DB-IP City Lite database (CC BY 4.0, credited in the site footer). Refreshed monthly by cron.
usage-statistics.dbfile = /dspace/geoip/dbip-city-lite.mmdb
# View/download statistics visible to administrators only
usage-statistics.authorization.admin.usage = true
# IPs are needed at visit time (country lookup, bot detection). The nightly
# `dspace anonymize-statistics` cron masks IPs of records older than this many days.
anonymize_statistics.time_threshold = 1

# Google Analytics 4 (frontend loads it only after visitor accepts the cookie banner)
google.analytics.key = G-JH19ZSGLCS

# CMA: second assetstore on the extra 250GB disk (/dev/sdb, mounted on the host at /mnt/dspace-data).
# Registered as store 3 in config/spring/api/bitstore.xml; mounted into the container by docker-compose.yml.
assetstore.dir.2 = ${dspace.dir}/assetstore2
# ACTIVATE ONLY after /mnt/dspace-data is mounted and the container was recreated with `docker compose up -d dspace`.
# New uploads then go to store 3; existing files stay in store 0. Setting this while the disk is NOT mounted
# would write uploads inside the container's own filesystem, where they are lost when the container is recreated.
assetstore.index.primary = 3

# CMA: search-only keywords. Visitors never see this field (REST API, item pages, OAI),
# but Discovery still indexes it, so searches for these terms find the item.
metadata.hide.local.keyword.hidden = true
