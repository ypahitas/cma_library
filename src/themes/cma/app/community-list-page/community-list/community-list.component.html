<!-- If we go back to promise variable <div *ngIf="communityList$ | async as communityList">-->
  <div class="row row-cols-2 row-cols-md-3">
    <ng-container *ngFor="let collection of communityListArray">
        <div class="col-md pb-2" *ngIf="collection.payload.type === 'collection'">
          <div class="card h-100">
            <img class="card-img-top" id="{{collection.id}}" src="" alt="Collection logo">
            <div class="card-body d-flex flex-column">            
              <h5 class="card-title">{{collection.name}}</h5>
              <p class="card-text">{{collection.payload.metadata["dc.description"][0].value}}</p>
              <a  class="card-link btn btn-primary mt-auto" href="{{collection.route}}">{{ 'collections.explore' | translate }}</a>
            </div>
            <div class="card-footer">
              <small class="text-muted"><span>{{collection.payload.archivedItemsCount}}</span><span> {{'browse.metadata.map.count.items'| translate }}</span></small>
            </div>
          </div>  
        </div>      
    </ng-container>
  </div>
<!--</div>-->
